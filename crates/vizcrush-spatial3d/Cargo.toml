[package]
name = "vizcrush-spatial3d"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Octree spatial indexing and frustum culling for 3D point data"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vizcrush-core = { path = "../vizcrush-core" }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
