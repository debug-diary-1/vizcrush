version: 2
updates:
  # npm updates are reviewed manually because Dependabot currently writes
  # concrete lockfile versions for pnpm `catalog:` specifiers, producing a
  # lockfile that fails `pnpm install --frozen-lockfile` (see PRs #49/#50).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
