name: Capture Benchmark Baseline

# Manually-triggered workflow that runs the benchmark suite on a CI runner
# and uploads the resulting `benchmark-baseline.json` as an artifact. Download
# the artifact and commit `benchmarks/benchmark-baseline.json` to main when
# you're happy with the numbers — subsequent CI runs will compare against it.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Run benchmarks and capture baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.94.1
          targets: wasm32-unknown-unknown
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.115 --locked
      - name: Build WASM
        env:
          SKIP_WASM_OPT: "1"
        run: bash scripts/build-wasm.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      - name: Run benchmarks with --save-baseline
        env:
          BENCH_SEED: "42"
        run: node --experimental-vm-modules benchmarks/dist/runner.js --save-baseline
      - name: Upload baseline artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-baseline
          path: benchmarks/benchmark-baseline.json
          if-no-files-found: error
          retention-days: 30
