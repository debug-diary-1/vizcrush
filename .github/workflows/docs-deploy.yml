name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "examples/**"
      - "packages/**"
      - "scripts/build-examples.sh"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build VitePress site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The examples import the workspace packages, and those packages only
      # reach their WASM path once the crates are compiled, so the docs deploy
      # now needs the Rust toolchain it previously did without.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: pnpm
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked # must match wasm-bindgen pin in Cargo.toml
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - run: pnpm install --frozen-lockfile
      - name: Build WASM and packages
        run: pnpm build
      - run: pnpm docs:build
      # Writes into docs/.vitepress/dist/examples, so the gallery ships inside
      # the same Pages artifact and lands at /vizcrush/examples/.
      - name: Build examples gallery
        run: pnpm examples:build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
