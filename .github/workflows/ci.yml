name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.94.1
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace
      - name: Build WASM
        run: |
          RUSTFLAGS="-C target-feature=+simd128" cargo build \
            --target wasm32-unknown-unknown --release --workspace

  lint-typecheck:
    name: Lint + Format + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.94.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.115 # must match wasm-bindgen pin in Cargo.toml
      # The packages import their wasm-bindgen glue by package specifier so the
      # path survives bundling, which also means `tsc` resolves it. The glue and
      # its .d.ts are generated, so anything that typechecks or builds now needs
      # the wasm present. wasm-opt is skipped: nothing here depends on it.
      - name: Build WASM
        env:
          SKIP_WASM_OPT: "1"
        run: bash scripts/build-wasm.sh
      - run: pnpm install --frozen-lockfile
      - name: Lint (oxlint)
        run: pnpm lint
      - name: Format check (oxfmt)
        run: pnpm format:check
      - name: Generated documentation inventory
        run: pnpm docs:inventory:check
      - name: Dependency automation policy
        run: pnpm check:dependency-policy
      - name: Typecheck
        run: pnpm typecheck

  typescript:
    name: TypeScript Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.94.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.115 # must match wasm-bindgen pin in Cargo.toml
      # Parity tests verify JS ≡ WASM through the kernel seam and REQUIRE the
      # real wasm build — without it they used to skip silently, meaning CI
      # never actually verified parity. wasm-opt is skipped: parity semantics
      # don't depend on binaryen's optimization pass (release builds run it).
      - name: Build WASM
        env:
          SKIP_WASM_OPT: "1"
        run: bash scripts/build-wasm.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      - name: Run Vitest
        env:
          VIZCRUSH_REQUIRE_WASM: "1"
        run: npx vitest run

  benchmark:
    name: Performance Regression
    runs-on: ubuntu-latest
    needs: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.94.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.115 # must match wasm-bindgen pin in Cargo.toml
      # The packages import their wasm-bindgen glue by package specifier so the
      # path survives bundling, which also means `tsc` resolves it. The glue and
      # its .d.ts are generated, so anything that typechecks or builds now needs
      # the wasm present. wasm-opt is skipped: nothing here depends on it.
      - name: Build WASM
        env:
          SKIP_WASM_OPT: "1"
        run: bash scripts/build-wasm.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      - name: Run regression benchmarks
        env:
          # Shared runners remain noisy on CPU-bound sort benchmarks. A 75%
          # threshold catches material regressions while the deterministic
          # input seed removes dataset variance.
          BENCH_THRESHOLD: "0.75"
          BENCH_SEED: "42"
        run: node --experimental-vm-modules benchmarks/dist/runner.js

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: npm audit
        run: pnpm audit --audit-level=high
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.94.1
      - name: cargo audit
        run: |
          cargo install cargo-audit --quiet
          cargo audit
