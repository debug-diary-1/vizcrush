name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@9bdad043e88c75890e36ad3bbc8d27f0090dd609 # v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace
      - name: Build WASM
        run: |
          RUSTFLAGS="-C target-feature=+simd128" cargo build \
            --target wasm32-unknown-unknown --release --workspace

  lint-typecheck:
    name: Lint + Format + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Lint (oxlint)
        run: pnpm lint
      - name: Format check (oxfmt)
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck

  typescript:
    name: TypeScript Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@72d126e709cad40056a62344eee609d696d62d33 # v2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.115 # must match wasm-bindgen pin in Cargo.toml
      # Parity tests verify JS ≡ WASM through the kernel seam and REQUIRE the
      # real wasm build — without it they used to skip silently, meaning CI
      # never actually verified parity. wasm-opt is skipped: parity semantics
      # don't depend on binaryen's optimization pass (release builds run it).
      - name: Build WASM
        env:
          SKIP_WASM_OPT: "1"
        run: bash scripts/build-wasm.sh
      - run: pnpm install
      - run: pnpm turbo build
      - name: Run Vitest
        env:
          VIZCRUSH_REQUIRE_WASM: "1"
        run: npx vitest run

  benchmark:
    name: Performance Regression
    runs-on: ubuntu-latest
    needs: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm turbo build
      - name: Run benchmarks
        env:
          # CI runners are noisy on CPU-bound benchmarks (sort especially can
          # vary 50-70% run-to-run). 100% threshold absorbs variance while
          # still catching real regressions (anything that doubles a hot path).
          BENCH_THRESHOLD: "1.0"
        run: node --experimental-vm-modules benchmarks/dist/runner.js
      - name: Check for regressions
        env:
          BENCH_THRESHOLD: "1.0"
        run: |
          if [ -f benchmarks/benchmark-baseline.json ]; then
            node --experimental-vm-modules benchmarks/dist/runner.js
          else
            echo "No baseline found — skipping regression check"
          fi

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: npm audit
        run: pnpm audit --audit-level=high
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: cargo audit
        run: |
          cargo install cargo-audit --quiet
          cargo audit
