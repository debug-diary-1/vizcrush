name: Release

permissions:
  contents: read

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      # No dependency caches in this job: it holds npm publish rights via OIDC,
      # and a restored cargo `target/` or pnpm store is attacker-controlled
      # input if the cache were ever poisoned. Builds from clean state instead;
      # ci.yml keeps its caches (those jobs publish nothing).
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked # must match wasm-bindgen pin in Cargo.toml
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build WASM
        run: bash scripts/build-wasm.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      # Publishing authenticates with npm Trusted Publishing (OIDC); there is no
      # long-lived npm token in this repo. `pnpm pack` builds the tarball
      # (rewriting `workspace:^` deps to real ranges) and the system
      # `npm publish` uploads it, exchanging this job's GitHub OIDC token
      # (`id-token: write` above) for a short-lived npm token. Each
      # @vizcrush/* package must list this exact publisher on npmjs.com:
      # GitHub Actions, owner debug-diary-1, repo vizcrush, workflow release.yml.
      # Nothing here can verify that; a package whose entry is missing or does
      # not permit publishing fails with a 404 on the token exchange.
      # The `registry-url` above writes a placeholder `_authToken` to .npmrc;
      # npm >= 11.5.1 overrides it once the OIDC exchange succeeds.
      - name: Assert npm can do trusted publishing (>= 11.5.1, OIDC, no token)
        run: |
          v="$(npm --version)"
          # shellcheck disable=SC2016
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) {
              console.error(`npm ${process.argv[1]} is older than 11.5.1; trusted publishing (OIDC) needs 11.5.1+`);
              process.exit(1);
            }
            console.log(`npm ${process.argv[1]} supports trusted publishing`);
          ' "$v"
          # An auth misconfiguration here is otherwise silent: npm answers a
          # bare 404 and nothing says the word "auth". Fail loudly instead.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "no OIDC token endpoint; this job needs \`id-token: write\`"
            exit 1
          fi
          # A real token would be used in place of the OIDC exchange.
          # setup-node's placeholder NODE_AUTH_TOKEN is not one and is fine.
          for var in NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG__AUTHTOKEN; do
            case "${!var:-}" in
              npm_*)
                echo "$var holds a long-lived npm token; this job publishes with OIDC only"
                exit 1
                ;;
            esac
          done
          echo "OIDC endpoint present and no long-lived npm token in the environment"
      # Publishes only versions the registry does not already have. The
      # packages version independently, so most tags change one or two of them
      # and the rest are already on npm at the same version. Without the skip,
      # the first unchanged package fails with EPUBLISHCONFLICT and, because
      # Actions runs `run:` under `bash -e`, the step aborts before reaching the
      # package that actually needed releasing.
      - name: Publish packages
        run: |
          published=0
          skipped=0
          for pkg in core downsample bin bin3d aggregate transform spatial spatial3d ai react mcp-server; do
            cd "packages/$pkg"
            name="$(node -p "require('./package.json').name")"
            version="$(node -p "require('./package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip    $name@$version (already on the registry)"
              skipped=$((skipped + 1))
            else
              echo "publish $name@$version"
              # pnpm packs (rewriting workspace:^ and catalog: specifiers);
              # npm uploads. pnpm 12 performs the OIDC token exchange itself
              # and got a 404 from npm for v2.3.0, so the upload goes through
              # the npm CLI, the client every earlier OIDC release used.
              rm -rf "$RUNNER_TEMP/pack"
              pnpm pack --pack-destination "$RUNNER_TEMP/pack"
              npm publish "$RUNNER_TEMP"/pack/*.tgz --access public --provenance
              published=$((published + 1))
            fi
            cd ../..
          done
          echo "published $published, skipped $skipped"
          if [ "$published" -eq 0 ]; then
            echo "::warning::No package versions were new; nothing was published for this tag."
          fi
