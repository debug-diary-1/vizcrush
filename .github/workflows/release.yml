name: Release

permissions:
  contents: read

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      # No dependency caches in this job: it holds npm publish rights via OIDC,
      # and a restored cargo `target/` or pnpm store is attacker-controlled
      # input if the cache were ever poisoned. Builds from clean state instead;
      # ci.yml keeps its caches (those jobs publish nothing).
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          # No `registry-url`: it writes a placeholder `_authToken` into a
          # generated .npmrc, and pnpm sends that placeholder instead of the
          # OIDC token, which npm answers with 404. Publishing needs no
          # registry-url -- the default registry is already npmjs.org.
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked # must match wasm-bindgen pin in Cargo.toml
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build WASM
        run: bash scripts/build-wasm.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      # Publishing authenticates with npm Trusted Publishing (OIDC); there is no
      # long-lived npm token in this repo. `pnpm publish` packs the package
      # (rewriting `workspace:^` deps to real ranges) and, since pnpm 12,
      # exchanges this job's GitHub OIDC token (`id-token: write` above) for a
      # short-lived npm token ITSELF. pnpm 11 shelled out to the system `npm
      # publish` and let npm do the exchange, which is why the v2.3.0 tag broke
      # on the pnpm 11 -> 12 upgrade: npm used to overwrite setup-node's
      # placeholder `_authToken`, pnpm does not, so it sent the placeholder and
      # npm answered `ERR_PNPM_AUTH_TOKEN_EXCHANGE ... 404`. Every @vizcrush/*
      # package on npmjs.com lists this exact publisher: GitHub Actions, owner
      # debug-diary-1, repo vizcrush, workflow release.yml.
      - name: Assert the publisher can do trusted publishing
        run: |
          v="$(pnpm --version)"
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 1 || (min === 1 && pat >= 3)));
            if (!ok) {
              console.error(`pnpm ${process.argv[1]} is older than 11.1.3; it cannot exchange the OIDC token`);
              process.exit(1);
            }
            console.log(`pnpm ${process.argv[1]} supports trusted publishing`);
          ' "$v"
          # The failure this guards is silent: a placeholder token is sent, npm
          # answers 404, and nothing says the word "auth". Fail loudly instead.
          for f in "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" ./.npmrc; do
            if [ -f "$f" ] && grep -q "_authToken" "$f"; then
              echo "$f carries an _authToken; pnpm would send it instead of the OIDC token"
              exit 1
            fi
          done
          echo "no _authToken in any .npmrc; the OIDC exchange is unobstructed"
      # Publishes only versions the registry does not already have. The
      # packages version independently, so most tags change one or two of them
      # and the rest are already on npm at the same version. Without the skip,
      # the first unchanged package fails with EPUBLISHCONFLICT and, because
      # Actions runs `run:` under `bash -e`, the step aborts before reaching the
      # package that actually needed releasing.
      - name: Publish packages
        run: |
          published=0
          skipped=0
          for pkg in core downsample bin bin3d aggregate transform spatial spatial3d ai react mcp-server; do
            cd "packages/$pkg"
            name="$(node -p "require('./package.json').name")"
            version="$(node -p "require('./package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip    $name@$version (already on the registry)"
              skipped=$((skipped + 1))
            else
              echo "publish $name@$version"
              pnpm publish --access public --no-git-checks --provenance
              published=$((published + 1))
            fi
            cd ../..
          done
          echo "published $published, skipped $skipped"
          if [ "$published" -eq 0 ]; then
            echo "::warning::No package versions were new; nothing was published for this tag."
          fi
