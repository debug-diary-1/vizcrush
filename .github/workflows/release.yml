name: Release

permissions:
  contents: read

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: wasm32-unknown-unknown
      # No dependency caches in this job: it holds npm publish rights via OIDC,
      # and a restored cargo `target/` or pnpm store is attacker-controlled
      # input if the cache were ever poisoned. Builds from clean state instead;
      # ci.yml keeps its caches (those jobs publish nothing).
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.115 # must match wasm-bindgen pin in Cargo.toml
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build WASM
        run: bash scripts/build-wasm.sh
      - run: pnpm install
      - run: pnpm turbo build
      # Publishing authenticates with npm Trusted Publishing (OIDC); there is no
      # long-lived npm token in this repo. `pnpm publish` packs the package
      # (rewriting `workspace:*` deps to real versions) and shells out to the
      # system `npm publish`, which exchanges this job's GitHub OIDC token
      # (`id-token: write` above) for a short-lived npm token. Every
      # @vizcrush/* package on npmjs.com lists this exact publisher:
      # GitHub Actions, owner debug-diary-1, repo vizcrush, workflow release.yml.
      # The `registry-url` above writes a placeholder `_authToken` to .npmrc;
      # npm >= 11.5.1 overrides it once the OIDC exchange succeeds.
      - name: Assert npm supports trusted publishing (>= 11.5.1)
        run: |
          v="$(npm --version)"
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) {
              console.error(`npm ${process.argv[1]} is older than 11.5.1; trusted publishing (OIDC) needs 11.5.1+`);
              process.exit(1);
            }
            console.log(`npm ${process.argv[1]} supports trusted publishing`);
          ' "$v"
      - name: Publish packages
        run: |
          for pkg in core downsample bin bin3d aggregate transform spatial spatial3d ai react mcp-server; do
            cd packages/$pkg
            pnpm publish --access public --no-git-checks --provenance
            cd ../..
          done
