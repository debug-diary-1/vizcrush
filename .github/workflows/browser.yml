name: Packaged Browser Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packed-browser:
    name: Packed Artifact (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.115
      - name: Build WASM
        env:
          SKIP_WASM_OPT: "1"
        run: bash scripts/build-wasm.sh
      - run: pnpm turbo build
      - name: Install browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Verify packed artifacts
        env:
          BROWSER: ${{ matrix.browser }}
          BROWSER_RESULT_PATH: benchmarks/results/browser-${{ matrix.browser }}.json
        run: node scripts/test-packed-browser.mjs
      - name: Upload browser measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packed-browser-${{ matrix.browser }}
          path: benchmarks/results/browser-${{ matrix.browser }}.json
          if-no-files-found: warn
          retention-days: 30
