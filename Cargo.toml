[workspace]
members = ["crates/*"]
resolver = "2"

# All versions pinned exactly (=x.y.z) to block supply-chain upgrades.
# To upgrade, bump here and run `cargo update` deliberately.
[workspace.dependencies]
wasm-bindgen = "=0.2.128"
js-sys = "=0.3.105"
serde = { version = "=1.0.229", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
serde_json = "=1.0.151"
wasm-bindgen-test = "=0.3.78"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
