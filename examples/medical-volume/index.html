<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vizcrush — Medical Volume Viewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #0a0a0f;
        color: #e0e0e8;
        font-family: "SF Mono", "Fira Code", "JetBrains Mono", monospace;
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 16px 24px 12px;
        border-bottom: 1px solid #1a1a2e;
      }

      h1 {
        font-size: 18px;
        font-weight: 600;
        color: #60a5fa;
        letter-spacing: -0.02em;
      }

      h1 span {
        color: #4b5563;
        font-weight: 400;
      }

      .subtitle {
        font-size: 12px;
        color: #6b7280;
        margin-top: 4px;
      }

      .stats-row {
        display: flex;
        gap: 24px;
        padding: 10px 24px;
        border-bottom: 1px solid #1a1a2e;
        font-size: 12px;
        flex-wrap: wrap;
      }

      .stat {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .stat-label {
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-size: 10px;
      }

      .stat-value {
        color: #a5b4fc;
        font-weight: 600;
      }

      .controls {
        display: flex;
        gap: 16px;
        padding: 10px 24px;
        border-bottom: 1px solid #1a1a2e;
        align-items: center;
        flex-wrap: wrap;
      }

      .control-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .control-group label {
        font-size: 11px;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .controls button {
        background: #1e1e2e;
        border: 1px solid #2a2a3e;
        color: #a5b4fc;
        padding: 4px 12px;
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
        border-radius: 4px;
        transition: background 0.15s;
      }

      .controls button:hover {
        background: #2a2a3e;
      }

      .controls button.active {
        background: #3730a3;
        border-color: #4f46e5;
        color: #e0e7ff;
      }

      .controls select {
        background: #16162a;
        border: 1px solid #2a2a4a;
        color: #c0c0c0;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
        outline: none;
      }

      .controls select:hover {
        border-color: #4f46e5;
      }

      .controls input[type="range"] {
        width: 200px;
        accent-color: #4f46e5;
      }

      .slice-label {
        font-size: 12px;
        color: #a5b4fc;
        font-weight: 600;
        min-width: 32px;
        text-align: center;
      }

      .main-area {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      .slice-panel {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      #slice-canvas {
        image-rendering: pixelated;
        border: 1px solid #1a1a2e;
        background: #000;
      }

      .overview-panel {
        width: 240px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-left: 1px solid #1a1a2e;
        padding: 16px;
      }

      .overview-label {
        font-size: 10px;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 8px;
      }

      #overview-canvas {
        border: 1px solid #1a1a2e;
        background: #050510;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>vizcrush <span>— Medical Volume Viewer</span></h1>
      <div class="subtitle">
        Synthetic CT scan data &rarr; voxel density grid &rarr; slice viewer
      </div>
    </header>

    <div class="stats-row">
      <div class="stat">
        <span class="stat-label">Backend</span>
        <span class="stat-value" id="stat-backend">&mdash;</span>
      </div>
      <div class="stat">
        <span class="stat-label">Voxels</span>
        <span class="stat-value" id="stat-voxels">&mdash;</span>
      </div>
      <div class="stat">
        <span class="stat-label">Grid Size</span>
        <span class="stat-value" id="stat-grid">&mdash;</span>
      </div>
      <div class="stat">
        <span class="stat-label">bin3d Time</span>
        <span class="stat-value" id="stat-time">&mdash;</span>
      </div>
      <div class="stat">
        <span class="stat-label">Max Density</span>
        <span class="stat-value" id="stat-max">&mdash;</span>
      </div>
    </div>

    <div class="controls">
      <div class="control-group">
        <label>Axis</label>
        <button data-axis="z" class="active">Z (axial)</button>
        <button data-axis="y">Y (coronal)</button>
        <button data-axis="x">X (sagittal)</button>
      </div>
      <div class="control-group">
        <label>Slice</label>
        <input type="range" id="slice-slider" min="0" max="63" value="32" />
        <span class="slice-label" id="slice-label">32</span>
      </div>
      <div class="control-group">
        <label>Color Map</label>
        <select id="color-map">
          <option value="grayscale" selected>Grayscale</option>
          <option value="bone">Bone</option>
          <option value="hot">Hot</option>
        </select>
      </div>
    </div>

    <div class="main-area">
      <div class="slice-panel">
        <canvas id="slice-canvas" width="512" height="512"></canvas>
      </div>
      <div class="overview-panel">
        <div class="overview-label">3D Overview</div>
        <canvas id="overview-canvas" width="200" height="200"></canvas>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
