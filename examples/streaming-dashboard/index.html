<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vizcrush — Streaming Dashboard</title>
    <style>
      body {
        margin: 0;
        background: #0a0a0a;
        color: #e0e0e0;
        font-family: system-ui;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
      }
      h1 {
        color: #3b9ecf;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 1rem;
        margin: 1.5rem 0;
      }
      .pill {
        background: #1a1a1a;
        padding: 1rem;
        border-radius: 8px;
        text-align: center;
      }
      .pill-label {
        font-size: 0.75rem;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .pill-value {
        font-size: 1.8rem;
        font-weight: bold;
        color: #3b9ecf;
        margin-top: 0.25rem;
        font-variant-numeric: tabular-nums;
      }
      canvas {
        width: 100%;
        height: 300px;
        background: #111;
        border-radius: 8px;
      }
      .controls {
        margin: 1rem 0;
        display: flex;
        gap: 1rem;
      }
      button {
        background: #3b9ecf;
        color: #fff;
        border: none;
        padding: 0.5rem 1.5rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9rem;
      }
      button:hover {
        background: #2d8ab8;
      }
      button.stop {
        background: #cf3b3b;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Streaming Dashboard</h1>
      <p>1,000 metrics/sec → rolling 20K buffer → 400 display points @ 60fps</p>
      <div class="controls">
        <button id="start">Start Stream</button>
        <button id="stop" class="stop">Stop</button>
      </div>
      <div class="stats-grid" id="stats"></div>
      <canvas id="chart"></canvas>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
