<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vizcrush — Reservoir Sampling Scatter</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #131313;
        color: #e5e2e1;
        font-family: "JetBrains Mono", "SF Mono", monospace;
        font-size: 12px;
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 2rem;
      }
      h1 {
        color: #4a7fd4;
        margin-bottom: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-size: 14px;
        font-weight: 600;
      }
      .subtitle {
        color: #888;
        margin-bottom: 2rem;
      }
      .main-layout {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 1.5rem;
      }
      .section {
        background: #1c1b1b;
        border: 1px solid #2a2a2a;
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .section h2 {
        color: #ccc;
        font-size: 1rem;
        margin-bottom: 0.75rem;
      }
      .controls {
        display: flex;
        gap: 1rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .controls select {
        padding: 0.4rem 0.8rem;
        background: #1c1b1b;
        color: #e5e2e1;
        border: 1px solid #353534;
        font-family: inherit;
        border-radius: 6px;
        font-size: 0.9rem;
      }
      .controls label {
        color: #888;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      #canvas-scatter {
        width: 100%;
        height: 520px;
        display: block;
        border-radius: 8px;
        border: 1px solid #2a2a2a;
      }
      #canvas-density {
        width: 100%;
        height: 200px;
        display: block;
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
        padding: 0.4rem 0;
        border-bottom: 1px solid #222;
        font-size: 0.8rem;
      }
      .stat-row .label {
        color: #666;
      }
      .stat-row .val-full {
        color: #666;
      }
      .stat-row .val-sample {
        color: #50e080;
      }
      .legend {
        display: flex;
        gap: 1.5rem;
        margin-top: 0.5rem;
        font-size: 0.8rem;
        color: #888;
      }
      .legend-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 4px;
        vertical-align: middle;
      }
      .ks-badge {
        display: inline-block;
        padding: 0.3rem 0.8rem;
        border-radius: 6px;
        font-size: 0.85rem;
        margin-top: 0.5rem;
      }
      .ks-pass {
        background: #1a3a2a;
        color: #50e080;
        border: 1px solid #2a5a3a;
      }
      .ks-fail {
        background: #3a1a1a;
        color: #e05050;
        border: 1px solid #5a2a2a;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Reservoir Sampling — Scatter Proof</h1>
      <p class="subtitle">Visual proof that reservoir sampling produces a representative subset</p>

      <div class="controls">
        <label
          >Total Points:
          <select id="total-points">
            <option value="10000">10K</option>
            <option value="50000" selected>50K</option>
            <option value="100000">100K</option>
          </select>
        </label>
        <label
          >Sample k:
          <select id="sample-k">
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="500" selected>500</option>
            <option value="1000">1000</option>
          </select>
        </label>
        <label
          >Distribution:
          <select id="dist-type">
            <option value="spiral" selected>Spiral</option>
            <option value="clusters">Clusters</option>
            <option value="grid-with-gaps">Grid with Gaps</option>
          </select>
        </label>
      </div>

      <div class="main-layout">
        <div>
          <div class="section" style="padding: 0; overflow: hidden">
            <canvas id="canvas-scatter"></canvas>
          </div>
          <div class="legend">
            <span
              ><span class="legend-dot" style="background: rgba(255, 255, 255, 0.15)"></span>Full
              dataset (faded)</span
            >
            <span
              ><span class="legend-dot" style="background: #50e080"></span>Reservoir sample
              (k)</span
            >
          </div>
        </div>

        <div>
          <div class="section">
            <h2>Quadrant Density (4x4)</h2>
            <canvas id="canvas-density"></canvas>
          </div>

          <div class="section">
            <h2>KS Test (x-marginal)</h2>
            <div id="ks-result">--</div>
          </div>

          <div class="section">
            <h2>Stats Comparison</h2>
            <div
              style="
                display: flex;
                gap: 1rem;
                font-size: 0.75rem;
                color: #666;
                margin-bottom: 0.3rem;
              "
            >
              <span style="flex: 1">Metric</span>
              <span style="width: 70px; text-align: right">Full</span>
              <span style="width: 70px; text-align: right; color: #50e080">Sample</span>
            </div>
            <div id="stats-panel"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
