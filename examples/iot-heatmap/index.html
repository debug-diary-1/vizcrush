<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vizcrush — IoT Sensor Heatmap</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0a0a;
        color: #e0e0e0;
        font-family: system-ui;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
      }
      h1 {
        color: #3b9ecf;
      }
      .subtitle {
        color: #888;
        margin-bottom: 1.5rem;
      }
      .controls {
        display: flex;
        gap: 1rem;
        margin-bottom: 1rem;
      }
      select {
        background: #1a1a1a;
        color: #e0e0e0;
        border: 1px solid #333;
        padding: 0.5rem;
        border-radius: 4px;
      }
      .stats-row {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        margin: 1rem 0;
      }
      .stat {
        background: #1a1a1a;
        padding: 0.75rem 1rem;
        border-radius: 6px;
      }
      .stat-label {
        font-size: 0.7rem;
        color: #666;
        text-transform: uppercase;
      }
      .stat-value {
        font-size: 1.3rem;
        font-weight: 600;
        color: #3b9ecf;
        font-variant-numeric: tabular-nums;
      }
      canvas {
        background: #111;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>IoT Sensor Heatmap</h1>
      <p class="subtitle">500K GPS coordinates → density heatmap via bin2d</p>
      <div class="controls">
        <select id="resolution">
          <option value="32">32x32</option>
          <option value="64">64x64</option>
          <option value="128" selected>128x128</option>
          <option value="256">256x256</option>
        </select>
      </div>
      <div class="stats-row" id="stats"></div>
      <canvas id="heatmap" width="512" height="512"></canvas>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
