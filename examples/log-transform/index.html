<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vizcrush — Log Transform Explorer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #131313;
        color: #e5e2e1;
        font-family: "JetBrains Mono", "SF Mono", monospace;
        font-size: 12px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
      }
      h1 {
        color: #4a7fd4;
        margin-bottom: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-size: 14px;
        font-weight: 600;
      }
      .subtitle {
        color: #888;
        margin-bottom: 2rem;
      }
      .section {
        background: #1c1b1b;
        border: 1px solid #2a2a2a;
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 2rem;
      }
      .section h2 {
        color: #ccc;
        font-size: 1.1rem;
        margin-bottom: 0.5rem;
      }
      .section .desc {
        color: #666;
        font-size: 0.85rem;
        margin-bottom: 1.5rem;
      }
      .controls {
        display: flex;
        gap: 1rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .controls select,
      .controls input {
        padding: 0.4rem 0.8rem;
        background: #1c1b1b;
        color: #e5e2e1;
        border: 1px solid #353534;
        font-family: inherit;
        border-radius: 6px;
        font-size: 0.9rem;
      }
      .controls label {
        color: #888;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .three-col {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }
      .hist-panel {
        text-align: center;
      }
      .hist-panel h3 {
        color: #aaa;
        font-size: 0.9rem;
        margin-bottom: 0.5rem;
      }
      canvas {
        width: 100%;
        height: 260px;
        display: block;
      }
      #canvas-overlay {
        height: 280px;
      }
      .arrow {
        color: #4a7fd4;
        font-size: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        margin-top: 1rem;
      }
      .stat-card {
        background: #131313;
        border: 1px solid #1c1b1b;
        border-radius: 8px;
        padding: 0.8rem;
        text-align: center;
      }
      .stat-card .label {
        color: #666;
        font-size: 0.75rem;
        text-transform: uppercase;
      }
      .stat-card .values {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        margin-top: 0.3rem;
      }
      .stat-card .before {
        color: #e07040;
        font-size: 0.9rem;
      }
      .stat-card .after {
        color: #40c0a0;
        font-size: 0.9rem;
      }
      .custom-base {
        display: none;
        align-items: center;
        gap: 0.5rem;
      }
      .custom-base.visible {
        display: flex;
      }
      #custom-base-val {
        color: #4a7fd4;
        min-width: 2.5rem;
        text-align: center;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Log Transform Explorer</h1>
      <p class="subtitle">
        Interactive exploration of how log transforms reshape skewed distributions
      </p>

      <div class="section">
        <div class="controls">
          <label
            >Distribution:
            <select id="dist-type">
              <option value="lognormal" selected>Log-Normal</option>
              <option value="exponential">Exponential</option>
              <option value="pareto">Pareto</option>
              <option value="chi-squared">Chi-Squared</option>
            </select>
          </label>
          <label
            >Sample Size:
            <select id="sample-size">
              <option value="10000">10K</option>
              <option value="50000" selected>50K</option>
            </select>
          </label>
          <label
            >Base:
            <select id="log-base">
              <option value="e" selected>e (natural log)</option>
              <option value="2">2</option>
              <option value="10">10</option>
              <option value="custom">Custom</option>
            </select>
          </label>
          <div class="custom-base" id="custom-base-wrap">
            <input type="range" id="custom-base" min="1.1" max="100" step="0.1" value="5" />
            <span id="custom-base-val">5.0</span>
          </div>
        </div>

        <div class="three-col">
          <div class="hist-panel">
            <h3>Raw Data</h3>
            <canvas id="canvas-raw"></canvas>
          </div>
          <div class="arrow" id="arrow-label">&rarr; log(x)</div>
          <div class="hist-panel">
            <h3>Transformed</h3>
            <canvas id="canvas-transformed"></canvas>
          </div>
        </div>

        <div class="section" style="margin-bottom: 0">
          <h2>Overlay Comparison (normalized area)</h2>
          <canvas id="canvas-overlay"></canvas>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="label">Skewness</div>
            <div class="values">
              <span class="before" id="stat-skew-before">--</span>
              <span style="color: #555">&rarr;</span>
              <span class="after" id="stat-skew-after">--</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="label">Kurtosis</div>
            <div class="values">
              <span class="before" id="stat-kurt-before">--</span>
              <span style="color: #555">&rarr;</span>
              <span class="after" id="stat-kurt-after">--</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="label">Mean</div>
            <div class="values">
              <span class="before" id="stat-mean-before">--</span>
              <span style="color: #555">&rarr;</span>
              <span class="after" id="stat-mean-after">--</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="label">Min</div>
            <div class="values">
              <span class="before" id="stat-min-before">--</span>
              <span style="color: #555">&rarr;</span>
              <span class="after" id="stat-min-after">--</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="label">Max</div>
            <div class="values">
              <span class="before" id="stat-max-before">--</span>
              <span style="color: #555">&rarr;</span>
              <span class="after" id="stat-max-after">--</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="label">Std Dev</div>
            <div class="values">
              <span class="before" id="stat-std-before">--</span>
              <span style="color: #555">&rarr;</span>
              <span class="after" id="stat-std-after">--</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
