<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPU PARTICLE SYSTEM</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #131313;
        color: #e5e2e1;
        font-family: "JetBrains Mono", "SF Mono", monospace;
        font-size: 12px;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }
      h1 {
        text-transform: uppercase;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.05em;
        margin: 0;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
      }
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 16px;
        background: rgba(28, 27, 27, 0.85);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid #2a2a2a;
      }
      #header {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      #subtitle {
        font-size: 10px;
        color: #777;
      }
      #stats {
        display: flex;
        gap: 16px;
        align-items: center;
        font-size: 11px;
      }
      .stat-label {
        color: #777;
      }
      .stat-value {
        color: #4a7fd4;
        font-weight: 600;
      }
      #controls {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      select,
      button {
        font-family: "JetBrains Mono", "SF Mono", monospace;
        font-size: 11px;
        background: #1c1b1b;
        color: #e5e2e1;
        border: 1px solid #353534;
        padding: 4px 8px;
        border-radius: 3px;
        cursor: pointer;
        outline: none;
      }
      select:hover,
      button:hover {
        border-color: #4a7fd4;
      }
      .slider-group {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .slider-group label {
        color: #777;
        font-size: 10px;
        white-space: nowrap;
      }
      input[type="range"] {
        width: 80px;
        accent-color: #4a7fd4;
        height: 4px;
      }
      button#reset {
        background: #4a7fd4;
        color: #131313;
        border-color: #4a7fd4;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <div id="header">
        <h1>GPU PARTICLE SYSTEM</h1>
        <div id="subtitle">
          WebGPU compute physics + prefix-sum stream compaction + render pipeline
        </div>
      </div>
      <div id="stats">
        <span><span class="stat-label">FPS </span><span class="stat-value" id="fps">0</span></span>
        <span
          ><span class="stat-label">ALIVE </span><span class="stat-value" id="alive">0</span
          ><span class="stat-label"> / </span><span class="stat-value" id="total">0</span></span
        >
        <span
          ><span class="stat-label">COMPUTE </span><span class="stat-value" id="computeMs">0.0</span
          ><span class="stat-label">ms</span></span
        >
        <span
          ><span class="stat-label">RENDER </span><span class="stat-value" id="renderMs">0.0</span
          ><span class="stat-label">ms</span></span
        >
        <span
          ><span class="stat-label">BACKEND </span
          ><span class="stat-value" id="backend">—</span></span
        >
      </div>
      <div id="controls">
        <select id="countSelect">
          <option value="10000">10K</option>
          <option value="50000" selected>50K</option>
          <option value="100000">100K</option>
          <option value="500000">500K</option>
        </select>
        <div class="slider-group">
          <label>GRAVITY</label>
          <input type="range" id="gravity" min="0" max="2" step="0.05" value="0.5" />
        </div>
        <div class="slider-group">
          <label>SPAWN</label>
          <input type="range" id="spawnRate" min="10" max="5000" step="10" value="2000" />
        </div>
        <button id="reset">RESET</button>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
