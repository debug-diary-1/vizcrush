<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vizcrush + Chart.js Integration</title>
    <style>
      body {
        margin: 0;
        background: #0a0a0a;
        color: #e0e0e0;
        font-family: system-ui;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
      }
      h1 {
        color: #3b9ecf;
      }
      .chart {
        width: 100%;
        height: 400px;
        background: #111;
        border-radius: 8px;
        margin: 1rem 0;
      }
      .stats {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .stat {
        background: #1a1a1a;
        padding: 1rem;
        border-radius: 6px;
        min-width: 150px;
      }
      .stat-label {
        font-size: 0.8rem;
        color: #888;
      }
      .stat-value {
        font-size: 1.5rem;
        font-weight: bold;
        color: #3b9ecf;
      }
      .pipeline {
        color: #aaa;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        line-height: 1.7;
      }
      code {
        color: #6fc7f0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>vizcrush + Chart.js</h1>
      <p class="pipeline">
        Typed arrays → <code>lttb</code> / <code>bin2d</code> → ordinary Chart.js datasets
      </p>
      <p>
        vizcrush reduces the expensive raw data; Chart.js handles axes, interaction, and rendering.
      </p>
      <div class="stats" id="stats"></div>
      <div class="chart" id="line-chart">
        <p style="padding: 2rem; color: #666">Line chart: LTTB downsampled 1M → 2000 points</p>
      </div>
      <div class="chart" id="scatter-chart">
        <p style="padding: 2rem; color: #666">Scatter density: bin2d 500K → 128×128 grid</p>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
