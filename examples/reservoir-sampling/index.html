<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vizcrush — Reservoir Sampling</title>
    <style>
      body {
        margin: 0;
        background: #131313;
        color: #e5e2e1;
        font-family: "JetBrains Mono", "SF Mono", monospace;
        font-size: 12px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
      }
      h1 {
        color: #4a7fd4;
        margin-bottom: 0.25rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-size: 14px;
        font-weight: 600;
      }
      .subtitle {
        color: #888;
        margin-top: 0;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin: 1.5rem 0;
        align-items: center;
      }
      .control-group {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .control-group label {
        font-size: 0.75rem;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      select,
      input[type="range"] {
        background: #1c1b1b;
        color: #e5e2e1;
        border: 1px solid #2a2a2a;
        border-radius: 4px;
        padding: 0.4rem 0.6rem;
        font-size: 0.85rem;
        font-family: inherit;
      }
      select {
        cursor: pointer;
      }
      input[type="range"] {
        width: 160px;
        accent-color: #4a7fd4;
      }
      .range-val {
        color: #4a7fd4;
        font-weight: bold;
        font-size: 0.85rem;
      }
      .layout {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 1.5rem;
      }
      canvas {
        width: 100%;
        background: #111;
        border-radius: 8px;
        border: 1px solid #2a2a2a;
      }
      #scatter {
        height: 360px;
      }
      #histogram {
        height: 200px;
      }
      .side-panel {
        background: #1c1b1b;
        border-radius: 8px;
        border: 1px solid #2a2a2a;
        padding: 1.25rem;
      }
      .side-panel h3 {
        color: #4a7fd4;
        margin-top: 0;
        font-size: 0.95rem;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
        margin-bottom: 1.25rem;
      }
      .stat {
        background: #0f0f1e;
        padding: 0.6rem;
        border-radius: 6px;
      }
      .stat-label {
        font-size: 0.7rem;
        color: #888;
        text-transform: uppercase;
      }
      .stat-value {
        font-size: 1.1rem;
        font-weight: bold;
        color: #4a7fd4;
        font-variant-numeric: tabular-nums;
      }
      .chi-result {
        background: #0f0f1e;
        padding: 0.75rem;
        border-radius: 6px;
        margin-top: 0.75rem;
      }
      .chi-result .pass {
        color: #4caf50;
      }
      .chi-result .fail {
        color: #f44336;
      }
      @media (max-width: 800px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Reservoir Sampling</h1>
      <p class="subtitle">How sample size k affects representativeness of a stream sample</p>
      <div class="controls">
        <div class="control-group">
          <label>Sample size (k): <span id="k-val" class="range-val">100</span></label>
          <input type="range" id="k-slider" min="0" max="4" value="2" />
        </div>
        <div class="control-group">
          <label>Data size</label>
          <select id="data-size">
            <option value="10000">10K</option>
            <option value="50000" selected>50K</option>
            <option value="100000">100K</option>
          </select>
        </div>
        <div class="control-group">
          <label>Distribution</label>
          <select id="distribution">
            <option value="uniform">Uniform</option>
            <option value="normal" selected>Normal</option>
            <option value="bimodal">Bimodal</option>
          </select>
        </div>
      </div>
      <div class="layout">
        <div>
          <canvas id="scatter"></canvas>
          <canvas id="histogram" style="margin-top: 1rem"></canvas>
        </div>
        <div class="side-panel" id="side-panel">
          <h3>Sample Statistics</h3>
          <div class="stats-grid" id="stats"></div>
          <h3>Histogram Comparison</h3>
          <div class="chi-result" id="chi-result"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
